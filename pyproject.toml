[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "heimweg"
version = "0.1.0"
description = "Findet mit Live-Daten die beste Bahnverbindung nach Hause, samt Plan B."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
notfall = ["fastapi>=0.115", "uvicorn>=0.32"]

[tool.setuptools]
packages = ["heimweg"]

[tool.setuptools.package-data]
heimweg = ["notfall.html", "notfall.js", "notfall.css"]
